{% extends "base.html" %}
{% block title %}Login - SecureVault{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow">
            <div class="card-header text-center py-3">
                <h4 class="mb-0"><i class="fas fa-lock me-2"></i>Secure Login</h4>
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                            <input type="email" name="email" class="form-control" required placeholder="you@email.com">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-key"></i></span>
                            <input type="password" name="password" id="password" class="form-control" required>
                            <button class="btn btn-outline-secondary" type="button"
                                    onclick="togglePwd()"><i class="fas fa-eye" id="eyeIcon"></i></button>
                        </div>
                    </div>
                    <div class="d-grid mb-3">
                        <button type="submit" class="btn btn-primary btn-lg">
                            <i class="fas fa-sign-in-alt me-2"></i>Login
                        </button>
                    </div>
                </form>

                <div class="text-center my-3">
                    <span class="text-muted">── or continue with ──</span>
                </div>

                <div class="d-grid gap-2">
                    <a href="{{ url_for('auth.oauth_github') }}" class="btn btn-dark">
                        <i class="fab fa-github me-2"></i>Login with GitHub
                    </a>
                    <a href="{{ url_for('auth.oauth_google') }}" class="btn btn-outline-danger">
                        <i class="fab fa-google me-2"></i>Login with Google
                    </a>
                </div>

                <hr>
                <p class="text-center mb-0">
                    Don't have an account? <a href="{{ url_for('auth.register') }}">Register</a>
                </p>
            </div>
        </div>
    </div>
</div>
<script>
function togglePwd() {
    const p = document.getElementById('password');
    const i = document.getElementById('eyeIcon');
    if (p.type === 'password') { p.type = 'text'; i.classList.replace('fa-eye','fa-eye-slash'); }
    else { p.type = 'password'; i.classList.replace('fa-eye-slash','fa-eye'); }
}
</script>
{% endblock %}
